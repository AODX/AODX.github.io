services:
  - type: web
    name: eclipse-duel
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    autoDeploy: true
    healthCheckPath: /api/eclipse
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
